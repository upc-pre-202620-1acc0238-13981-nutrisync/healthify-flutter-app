name: healthify
description: "A new Flutter project."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: 7.3.2
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_local_notifications: 22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.2
  freezed_annotation: 3.1.0
  get_it: 9.3.0
  go_router: 18.1.2
  http: 1.6.0
  intl: 0.20.3
  json_annotation: 4.12.0
  qr_flutter: 4.1.0
  shared_preferences: 2.5.6
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  json_serializable: 6.15.2
  freezed: 4.0.1
  mocktail: 1.0.5
  bloc_test: 10.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/anton_regular.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans_regular.ttf
        - asset: assets/fonts/open_sans_semibold.ttf
          weight: 600
        - asset: assets/fonts/open_sans_bold.ttf
          weight: 700

# Launcher icon and native splash, from the Android app's logo and `surface` color. Regenerate with
# `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_foreground.png

flutter_native_splash:
  color: "#F6F4EE"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#F6F4EE"
    image: assets/branding/splash_logo.png
  web: false
