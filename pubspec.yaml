name: healthify
description: "A new Flutter project."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: 7.3.2
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.2
  freezed_annotation: 3.1.0
  get_it: 9.3.0
  go_router: 18.1.2
  http: 1.6.0
  intl: 0.20.3
  json_annotation: 4.12.0
  qr_flutter: 4.1.0
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  json_serializable: 6.15.2
  freezed: 4.0.1
  mocktail: 1.0.5
  bloc_test: 10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/anton_regular.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans_regular.ttf
        - asset: assets/fonts/open_sans_semibold.ttf
          weight: 600
        - asset: assets/fonts/open_sans_bold.ttf
          weight: 700
